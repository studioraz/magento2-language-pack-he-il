name: Release

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  call-release-please:
    uses: studioraz/ci-templates/.github/workflows/release-please.yml@master
    secrets:
      token: ${{ secrets.RELEASE_TOKEN }}
